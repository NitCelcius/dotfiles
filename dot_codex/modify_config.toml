{{- /* chezmoi:modify-template */ -}}
{{- /* Partial management: Codex's own app writes model choice, its     */ -}}
{{- /* MCP node_repl/cua_repl bridges, marketplace/plugin caches,        */ -}}
{{- /* per-project trust decisions, desktop UI state, and TUI one-time   */ -}}
{{- /* notice state directly into this file.                            */ -}}
{{- /* Those are carried over from the live file instead of being       */ -}}
{{- /* owned/committed here; everything else is owned below.            */ -}}
{{- $live := fromToml (.chezmoi.stdin | default "") -}}
{{- $scalars := pick $live "model" "model_reasoning_effort" "notify" "approvals_reviewer" "personality" "plan_mode_reasoning_effort" "web_search" -}}
{{- $tables := dict -}}
{{- if hasKey $live "mcp_servers" -}}
{{-   $mcp := get $live "mcp_servers" -}}
{{-   $keptMcp := dict -}}
{{-   range $name := list "node_repl" "cua_repl" -}}
{{-     if hasKey $mcp $name -}}{{- $keptMcp = set $keptMcp $name (get $mcp $name) -}}{{- end -}}
{{-   end -}}
{{-   if $keptMcp -}}{{- $tables = set $tables "mcp_servers" $keptMcp -}}{{- end -}}
{{- end -}}
{{- $tui := dict "status_line" (list "project-name" "git-branch" "branch-changes" "context-used" "five-hour-limit" "task-progress" "weekly-limit" "pull-request-number") "status_line_use_colors" true "theme" "catppuccin-latte" "pet" "seedy" "fullscreen_transcript" true -}}
{{- $liveTui := default (dict) (get $live "tui") -}}
{{- range $k := list "screen_reader_detection_done" "model_availability_nux" -}}
{{-   if hasKey $liveTui $k -}}{{- $tui = set $tui $k (get $liveTui $k) -}}{{- end -}}
{{- end -}}
{{- $tables = set $tables "tui" $tui -}}
{{- range $k := list "marketplaces" "shell_environment_policy" "desktop" "projects" -}}
{{-   if hasKey $live $k -}}{{- $tables = set $tables $k (get $live $k) -}}{{- end -}}
{{- end -}}
{{- if $scalars -}}
{{ toToml $scalars }}
{{ end -}}
project_doc_fallback_filenames = ["CLAUDE.md"]
project_doc_max_bytes = 65536
service_tier = "default"

[windows]
sandbox = "elevated"

[notice.model_migrations]
"gpt-5.3-codex" = "gpt-5.4"

[mcp_servers.unityMCP]
url = "http://127.0.0.1:8080/mcp"
enabled = false

[mcp_servers.notion]
url = "https://mcp.notion.com/mcp"

[features]
rmcp_client = true
js_repl = false
memories = true

[memories]
generate_memories = true
use_memories = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."sites@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."code-review@openai-bundled"]
enabled = true

[plugins."codex-app-tools@openai-bundled"]
enabled = false

[plugins."computer-use@openai-bundled"]
enabled = false

[plugins."unified-computer-use@openai-bundled"]
enabled = false

[apps.connector_openai_codex_document_control]
enabled = false
{{- if $tables }}

{{ toToml $tables }}
{{- end }}
