name: labels

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  area:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

  type-and-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Title prefix -> type label, so `feat(claude): ...` becomes `feat`.
            const TITLE_PATTERN = /^(?:WIP:\s*)?(feat|fix|refactor|docs|chore|style)(?:\([^)]*\))?!?:/;
            const TYPE_LABELS = ['feat', 'fix', 'refactor', 'docs', 'chore'];
            const PREFIX_TO_LABEL = { style: 'chore' };
            const STATE_DRAFT = 'state:draft';
            const STATE_NEEDS_REVIEW = 'state:needs-review';

            const issue = context.payload.pull_request ?? context.payload.issue;
            const current = new Set(issue.labels.map((label) => label.name));
            const wanted = new Set();

            const match = TITLE_PATTERN.exec(issue.title);
            if (match) wanted.add(PREFIX_TO_LABEL[match[1]] ?? match[1]);

            if (context.payload.pull_request) {
              wanted.add(issue.draft ? STATE_DRAFT : STATE_NEEDS_REVIEW);
            }

            // Only touch labels this workflow owns; leave area and manual labels alone.
            const owned = new Set([...TYPE_LABELS, STATE_DRAFT, STATE_NEEDS_REVIEW]);
            const toAdd = [...wanted].filter((name) => !current.has(name));
            const toRemove = [...current].filter((name) => owned.has(name) && !wanted.has(name));

            const target = { ...context.repo, issue_number: issue.number };
            if (toAdd.length) await github.rest.issues.addLabels({ ...target, labels: toAdd });
            for (const name of toRemove) {
              await github.rest.issues.removeLabel({ ...target, name });
            }
