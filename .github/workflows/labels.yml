name: labels

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  area:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

  type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Title prefix -> type label, so `feat(claude): ...` becomes `feat`.
            const TITLE_PATTERN = /^(?:WIP:\s*)?(feat|fix|refactor|docs|chore)(?:\([^)]*\))?!?:/;
            const TYPE_LABELS = ['feat', 'fix', 'refactor', 'docs', 'chore'];

            const issue = context.payload.pull_request ?? context.payload.issue;
            const current = new Set(issue.labels.map((label) => label.name));

            const match = TITLE_PATTERN.exec(issue.title);
            const wanted = new Set(match ? [match[1]] : []);

            // Only touch labels this workflow owns; leave area and manual labels alone.
            const owned = new Set(TYPE_LABELS);
            const toAdd = [...wanted].filter((name) => !current.has(name));
            const toRemove = [...current].filter((name) => owned.has(name) && !wanted.has(name));

            const target = { ...context.repo, issue_number: issue.number };
            if (toAdd.length) await github.rest.issues.addLabels({ ...target, labels: toAdd });
            for (const name of toRemove) {
              await github.rest.issues.removeLabel({ ...target, name });
            }
